workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

quota-contract:
  image:
    name: ghcr.io/getpaseo/paseo:0.7.2@sha256:da9286410d9dd86208755b789894534d9e200c9021bd45157557aac4146b84fb
    entrypoint: [""]
  timeout: 30m
  variables:
    ONNXRUNTIME_NODE_INSTALL: skip
    ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  script:
    - npm ci --ignore-scripts --no-audit --no-fund
    - npm run postinstall
    - npm run build:server
    - npm run build --workspace=@getpaseo/expo-two-way-audio
    - npm run typecheck
    - npm run lint
    - npm run format:check
    - npx vitest run packages/server/src/services/quota-fetcher/providers/codex-windows.test.ts packages/server/src/services/quota-fetcher/service.test.ts packages/server/src/server/session/provider/provider-catalog-session.test.ts packages/client/src/daemon-client.test.ts packages/protocol/src/messages.test.ts --bail=1
